site_name: Cheat Sheets
site_author: Yanick Spichty
site_url: https://yanick.spichty.org/cheatsheets/

theme:
  name: material
  palette:
    scheme: slate
    primary: blue grey
    accent: light blue
  features:
    - navigation.top
    - toc.integrate
    - content.code.copy

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - tmux: tmux.md
  - Vim: vim.md
  - Linux: linux.md
